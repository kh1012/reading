<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect x="20" y="20" width="280" height="280" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="35" y="48" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f2937">포그라운드 탭 (현재 화면)</text>
  <rect x="35" y="70" width="250" height="70" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="45" y="95" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb">DOM 렌더링 및 사용자 뷰</text>
  <text x="45" y="120" font-family="sans-serif" font-size="12" fill="#1f2937">HTML / CSS / JS 실행 중</text>
  <rect x="35" y="160" width="250" height="120" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="45" y="185" font-family="sans-serif" font-size="13" font-weight="bold" fill="#16a34a">Speculation Rules 정의</text>
  <text x="45" y="210" font-family="sans-serif" font-size="12" fill="#1f2937">script type="speculationrules"</text>
  <text x="45" y="235" font-family="sans-serif" font-size="12" fill="#1f2937">문서 규칙 감지 및 타깃 선별</text>
  <text x="45" y="260" font-family="sans-serif" font-size="12" fill="#1f2937">eagerness: moderate (200ms)</text>
  <path d="M 305 160 L 335 160" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="145" font-family="sans-serif" font-size="12" fill="#2563eb" text-anchor="middle">사전 로드</text>
  <rect x="340" y="20" width="280" height="280" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="355" y="48" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2563eb">백그라운드 렌더러 (비가시 탭)</text>
  <rect x="355" y="70" width="250" height="90" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="365" y="95" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">렌더링 파이프라인 사전 완주</text>
  <text x="365" y="120" font-family="sans-serif" font-size="12" fill="#1f2937">HTML 파싱 및 DOM/CSSOM 구성</text>
  <text x="365" y="145" font-family="sans-serif" font-size="12" fill="#16a34a">styleAndLayoutStart / renderStart</text>
  <rect x="355" y="180" width="250" height="100" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="365" y="205" font-family="sans-serif" font-size="13" font-weight="bold" fill="#dc2626">사이드 이펙트 차단 및 대기</text>
  <text x="365" y="230" font-family="sans-serif" font-size="12" fill="#1f2937">document.prerendering: true</text>
  <text x="365" y="255" font-family="sans-serif" font-size="12" fill="#1f2937">오디오 / 권한 팝업 / 알림 지연</text>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>
</svg>