<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <rect width="640" height="360" fill="#ffffff"/>
  <rect x="20" y="20" width="600" height="320" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="36" y="46" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f2937">웹 출처 스코프 (Origin Boundary: https://example.com)</text>
  <rect x="36" y="60" width="180" height="40" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="46" y="85" font-family="sans-serif" font-size="12" fill="#2563eb">window.caches (메인 스레드)</text>
  <rect x="230" y="60" width="180" height="40" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="240" y="85" font-family="sans-serif" font-size="12" fill="#2563eb">self.caches (Service Worker)</text>
  <rect x="424" y="60" width="180" height="40" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="434" y="85" font-family="sans-serif" font-size="12" fill="#2563eb">self.caches (Web Worker)</text>
  <rect x="36" y="115" width="568" height="210" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="48" y="138" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">CacheStorage (출처별 단일 스토리지 네임스페이스)</text>
  <rect x="52" y="152" width="260" height="158" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="64" y="174" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb">Cache: 'app-shell-v2'</text>
  <rect x="64" y="186" width="236" height="52" rx="3" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
  <text x="72" y="204" font-family="sans-serif" font-size="12" fill="#1f2937">Key: Request ('/styles/main.css')</text>
  <text x="72" y="224" font-family="sans-serif" font-size="12" fill="#16a34a">Val: Response (200 OK, Body Stream)</text>
  <rect x="64" y="246" width="236" height="52" rx="3" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
  <text x="72" y="264" font-family="sans-serif" font-size="12" fill="#1f2937">Key: Request ('/scripts/app.js')</text>
  <text x="72" y="284" font-family="sans-serif" font-size="12" fill="#16a34a">Val: Response (200 OK, Body Stream)</text>
  <rect x="328" y="152" width="260" height="158" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="340" y="174" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb">Cache: 'dynamic-cache-v1'</text>
  <rect x="340" y="186" width="236" height="52" rx="3" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
  <text x="348" y="204" font-family="sans-serif" font-size="12" fill="#1f2937">Key: Request ('/api/v1/user')</text>
  <text x="348" y="224" font-family="sans-serif" font-size="12" fill="#16a34a">Val: Response (200 OK, JSON Stream)</text>
  <rect x="340" y="246" width="236" height="52" rx="3" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
  <text x="348" y="264" font-family="sans-serif" font-size="12" fill="#1f2937">Key: Request ('/assets/banner.png')</text>
  <text x="348" y="284" font-family="sans-serif" font-size="12" fill="#16a34a">Val: Response (200 OK, Image Blob)</text>
</svg>