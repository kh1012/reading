<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <rect width="640" height="320" fill="#ffffff"/>
  
  <!-- Outer Title Area -->
  <text x="24" y="32" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f2937">Proxy 객체 내부 슬롯 및 트랩 디스패치 구조</text>
  <text x="24" y="50" font-family="sans-serif" font-size="12" fill="#1f2937">호출자 연산 가로채기 및 타겟 포워딩 아키텍처</text>

  <!-- Caller Box -->
  <rect x="24" y="80" width="130" height="190" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="40" y="105" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">호출자 (Client)</text>
  <text x="36" y="135" font-family="sans-serif" font-size="12" fill="#1f2937">• obj.prop</text>
  <text x="36" y="160" font-family="sans-serif" font-size="12" fill="#1f2937">• obj.prop = val</text>
  <text x="36" y="185" font-family="sans-serif" font-size="12" fill="#1f2937">• delete obj.prop</text>
  <text x="36" y="210" font-family="sans-serif" font-size="12" fill="#1f2937">• obj(...args)</text>
  <text x="36" y="240" font-family="sans-serif" font-size="12" fill="#2563eb">13개 MOP 연산</text>

  <!-- Arrow: Caller -> Proxy -->
  <line x1="154" y1="175" x2="194" y2="175" stroke="#2563eb" stroke-width="2"/>
  <polygon points="194,171 202,175 194,179" fill="#2563eb"/>

  <!-- Proxy Exotic Object Box -->
  <rect x="204" y="80" width="190" height="190" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="220" y="105" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb">Proxy (Exotic Object)</text>
  <text x="220" y="125" font-family="sans-serif" font-size="12" fill="#1f2937">ProxyCreate(target, handler)</text>

  <!-- Slot 1: ProxyHandler -->
  <rect x="216" y="140" width="166" height="50" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
  <text x="226" y="160" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937">[[ProxyHandler]]</text>
  <text x="226" y="178" font-family="sans-serif" font-size="12" fill="#1f2937">트랩 객체 참조</text>

  <!-- Slot 2: ProxyTarget -->
  <rect x="216" y="205" width="166" height="50" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
  <text x="226" y="225" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937">[[ProxyTarget]]</text>
  <text x="226" y="243" font-family="sans-serif" font-size="12" fill="#1f2937">원본 객체 참조</text>

  <!-- Arrow: Handler Slot -> Handler Box -->
  <line x1="382" y1="165" x2="434" y2="125" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="431,121 442,120 436,128" fill="#1f2937"/>

  <!-- Arrow: Target Slot -> Target Box -->
  <line x1="382" y1="230" x2="434" y2="230" stroke="#16a34a" stroke-width="1.5"/>
  <polygon points="434,226 442,230 434,234" fill="#16a34a"/>

  <!-- Handler Object Box -->
  <rect x="444" y="80" width="172" height="90" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="456" y="103" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">Handler 객체</text>
  <text x="456" y="123" font-family="sans-serif" font-size="12" fill="#1f2937">• get / set / has 트랩</text>
  <text x="456" y="142" font-family="sans-serif" font-size="12" fill="#1f2937">• deleteProperty / apply</text>
  <text x="456" y="160" font-family="sans-serif" font-size="12" fill="#dc2626">불변조건 강제 검증</text>

  <!-- Target Object Box -->
  <rect x="444" y="185" width="172" height="85" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="456" y="208" font-family="sans-serif" font-size="13" font-weight="bold" fill="#16a34a">Target 원본 객체</text>
  <text x="456" y="228" font-family="sans-serif" font-size="12" fill="#1f2937">• 기본 내부 메서드</text>
  <text x="456" y="247" font-family="sans-serif" font-size="12" fill="#16a34a">• Reflect API 연동</text>

  <!-- Bottom Notice -->
  <text x="24" y="295" font-family="sans-serif" font-size="12" fill="#1f2937">핸들러에 트랩이 없으면 엔진은 [[ProxyTarget]]의 기본 내부 메서드로 직접 포워딩합니다.</text>
</svg>