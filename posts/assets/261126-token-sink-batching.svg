<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280">
  <rect width="640" height="280" fill="#ffffff"/>
  
  <rect x="25" y="30" width="165" height="175" rx="8" fill="#f3f4f6" stroke="#1f2937" stroke-width="1.5"/>
  <text x="107" y="60" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="middle">네트워크 스트림</text>
  <text x="107" y="86" font-family="sans-serif" font-size="12" fill="#2563eb" text-anchor="middle">Prompt API</text>
  <text x="107" y="106" font-family="sans-serif" font-size="12" fill="#2563eb" text-anchor="middle">promptStreaming / SSE</text>
  <line x1="45" y1="120" x2="170" y2="120" stroke="#d1d5db" stroke-width="1"/>
  <text x="107" y="146" font-family="sans-serif" font-size="12" fill="#dc2626" font-weight="bold" text-anchor="middle">초당 수십~수백 개</text>
  <text x="107" y="170" font-family="sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">delta chunk 연속 인입</text>

  <line x1="190" y1="117" x2="225" y2="117" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow-batch)"/>
  <defs>
    <marker id="arrow-batch" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#1f2937"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect x="225" y="30" width="185" height="175" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="317" y="60" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">Token Sink (메모리 버퍼)</text>
  <text x="317" y="86" font-family="sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">buffer += deltaChunk</text>
  <text x="317" y="108" font-family="sans-serif" font-size="11" fill="#1f2937" text-anchor="middle">(DOM 직접 쓰기 전면 차단)</text>
  <line x1="245" y1="120" x2="390" y2="120" stroke="#bfdbfe" stroke-width="1"/>
  <text x="317" y="146" font-family="sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">isScheduled 플래그 관리</text>
  <text x="317" y="170" font-family="sans-serif" font-size="11" fill="#2563eb" font-weight="bold" text-anchor="middle">rAF 1회 등록 보장</text>

  <line x1="410" y1="117" x2="445" y2="117" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>

  <rect x="445" y="30" width="170" height="175" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="530" y="60" font-family="sans-serif" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="middle">화면 렌더링 갱신</text>
  <text x="530" y="86" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">V-Sync 동기화 틱</text>
  <text x="530" y="108" font-family="sans-serif" font-size="11" fill="#1f2937" text-anchor="middle">(60Hz 16.6ms / 120Hz 8.3ms)</text>
  <line x1="465" y1="120" x2="595" y2="120" stroke="#bbf7d0" stroke-width="1"/>
  <text x="530" y="146" font-family="sans-serif" font-size="12" fill="#16a34a" font-weight="bold" text-anchor="middle">프레임당 최대 1회 반영</text>
  <text x="530" y="170" font-family="sans-serif" font-size="11" fill="#1f2937" text-anchor="middle">target.textContent += buffer</text>

  <rect x="25" y="220" width="590" height="42" rx="6" fill="#f8fafc" stroke="#1f2937" stroke-width="1.2"/>
  <text x="320" y="246" font-family="sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">초당 수백 회 DOM 쓰기 폭주(Render Storm)를 차단하여 메인 스레드 프리징 및 INP 저하 방지</text>
</svg>