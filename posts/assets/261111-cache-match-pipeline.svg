<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280">
  <rect width="640" height="280" fill="#ffffff"/>
  <text x="20" y="30" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f2937">cache.match(request, options) 판정 흐름</text>
  <rect x="20" y="55" width="120" height="60" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="32" y="80" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2563eb">수신 Request</text>
  <text x="32" y="98" font-family="sans-serif" font-size="12" fill="#1f2937">URL 및 메서드</text>
  <line x1="140" y1="85" x2="165" y2="85" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="165,81 173,85 165,89" fill="#1f2937"/>
  <rect x="175" y="55" width="130" height="60" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="185" y="80" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937">HTTP 메서드 대조</text>
  <text x="185" y="98" font-family="sans-serif" font-size="12" fill="#2563eb">GET 검증 (ignoreMethod)</text>
  <line x1="305" y1="85" x2="330" y2="85" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="330,81 338,85 330,89" fill="#1f2937"/>
  <rect x="340" y="55" width="130" height="60" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="350" y="80" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937">URL 정규화 대조</text>
  <text x="350" y="98" font-family="sans-serif" font-size="12" fill="#2563eb">해시 제외 (ignoreSearch)</text>
  <line x1="470" y1="85" x2="495" y2="85" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="495,81 503,85 495,89" fill="#1f2937"/>
  <rect x="505" y="55" width="115" height="60" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="515" y="80" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937">Vary 헤더 검증</text>
  <text x="515" y="98" font-family="sans-serif" font-size="12" fill="#2563eb">Vary:* (ignoreVary)</text>
  <line x1="562" y1="115" x2="562" y2="150" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="562" y1="150" x2="420" y2="150" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="420" y1="150" x2="420" y2="185" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="416,185 420,193 424,185" fill="#16a34a"/>
  <rect x="340" y="195" width="160" height="65" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="355" y="222" font-family="sans-serif" font-size="13" font-weight="bold" fill="#16a34a">Cache Hit</text>
  <text x="355" y="242" font-family="sans-serif" font-size="12" fill="#1f2937">저장된 Response 객체 반환</text>
  <line x1="562" y1="150" x2="562" y2="185" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="558,185 562,193 566,185" fill="#dc2626"/>
  <rect x="505" y="195" width="115" height="65" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="520" y="222" font-family="sans-serif" font-size="13" font-weight="bold" fill="#dc2626">Cache Miss</text>
  <text x="520" y="242" font-family="sans-serif" font-size="12" fill="#1f2937">undefined 반환</text>
</svg>