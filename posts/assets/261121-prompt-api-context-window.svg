<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" width="100%" height="100%">
  <rect width="640" height="230" fill="#ffffff"/>

  <!-- Outer Context Window Bar -->
  <text x="30" y="38" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f2937">Session Context Window (최대 토큰 허용 한도: session.contextWindow)</text>
  
  <rect x="30" y="55" width="580" height="65" rx="6" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/>

  <!-- Segment 1: System Prompt -->
  <rect x="30" y="55" width="110" height="65" rx="4" fill="#2563eb" fill-opacity="0.2" stroke="#2563eb" stroke-width="1.5"/>
  <text x="40" y="85" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2563eb">System Prompt</text>
  <text x="40" y="103" font-family="sans-serif" font-size="11" fill="#1f2937">역할 및 규칙 정의</text>

  <!-- Segment 2: History Context -->
  <rect x="140" y="55" width="160" height="65" fill="#16a34a" fill-opacity="0.2" stroke="#16a34a" stroke-width="1.5"/>
  <text x="150" y="85" font-family="sans-serif" font-size="12" font-weight="bold" fill="#16a34a">Conversation History</text>
  <text x="150" y="103" font-family="sans-serif" font-size="11" fill="#1f2937">누적 질의응답 텍스트</text>

  <!-- Segment 3: New Prompt -->
  <rect x="300" y="55" width="120" height="65" fill="#dc2626" fill-opacity="0.15" stroke="#dc2626" stroke-width="1.5"/>
  <text x="308" y="85" font-family="sans-serif" font-size="12" font-weight="bold" fill="#dc2626">New Prompt</text>
  <text x="308" y="103" font-family="sans-serif" font-size="11" fill="#1f2937">measureContextUsage</text>

  <!-- Segment 4: Remaining Quota -->
  <rect x="420" y="55" width="190" height="65" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="435" y="85" font-family="sans-serif" font-size="12" font-weight="bold" fill="#64748b">Remaining Token Quota</text>
  <text x="435" y="103" font-family="sans-serif" font-size="11" fill="#64748b">모델 응답 생성 가용 여유분</text>

  <!-- Annotations underneath -->
  <line x1="30" y1="135" x2="300" y2="135" stroke="#2563eb" stroke-width="2"/>
  <polygon points="30,131 22,135 30,139" fill="#2563eb"/>
  <polygon points="300,131 308,135 300,139" fill="#2563eb"/>
  <text x="75" y="153" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2563eb">현재 점유량: session.contextUsage</text>

  <line x1="300" y1="135" x2="420" y2="135" stroke="#dc2626" stroke-width="2"/>
  <polygon points="420,131 428,135 420,139" fill="#dc2626"/>
  <text x="308" y="153" font-family="sans-serif" font-size="12" font-weight="bold" fill="#dc2626">사전 계산: estimatedTokens</text>

  <rect x="30" y="175" width="580" height="40" rx="4" fill="#f1f5f9"/>
  <text x="45" y="200" font-family="sans-serif" font-size="12" fill="#1f2937">
    검증 공식: <tspan font-weight="bold" fill="#1f2937">session.contextUsage + estimatedTokens &lt;= session.contextWindow</tspan> (초과 시 슬라이딩 윈도우 축소 필요)
  </text>
</svg>