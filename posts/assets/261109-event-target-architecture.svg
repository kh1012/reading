<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380">
  <rect width="640" height="380" fill="#ffffff" />
  <rect x="20" y="20" width="600" height="340" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="2" />
  <text x="35" y="48" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f2937">EventTarget 인스턴스 (메모리 구조)</text>
  <rect x="40" y="70" width="340" height="270" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="55" y="95" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb">내부 슬롯: 이벤트 리스너 맵 (Listener Map)</text>
  <rect x="55" y="115" width="310" height="100" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1" />
  <text x="65" y="135" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937">이벤트 타입 키: "statechange"</text>
  <rect x="65" y="145" width="290" height="30" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1" />
  <text x="75" y="165" font-family="sans-serif" font-size="12" fill="#16a34a">리스너 1: Callback 함수 (capture: false)</text>
  <rect x="65" y="180" width="290" height="30" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1" />
  <text x="75" y="200" font-family="sans-serif" font-size="12" fill="#dc2626">리스너 2: handleEvent 객체 + AbortSignal</text>
  <rect x="55" y="225" width="310" height="100" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1" />
  <text x="65" y="245" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937">이벤트 타입 키: "open" / "close"</text>
  <rect x="65" y="255" width="290" height="30" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1" />
  <text x="75" y="275" font-family="sans-serif" font-size="12" fill="#16a34a">리스너: UIComponent (handleEvent 메서드)</text>
  <rect x="65" y="290" width="290" height="25" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="1" />
  <text x="75" y="307" font-family="sans-serif" font-size="12" fill="#2563eb">중복 등록 검증: type + callback + capture 일치 시 무시</text>
  <rect x="410" y="70" width="190" height="120" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />
  <text x="420" y="95" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb">dispatchEvent(event)</text>
  <text x="420" y="120" font-family="sans-serif" font-size="12" fill="#1f2937">• 동기적(Synchronous) 실행</text>
  <text x="420" y="140" font-family="sans-serif" font-size="12" fill="#1f2937">• 등록 순서대로 즉시 호출</text>
  <text x="420" y="160" font-family="sans-serif" font-size="12" fill="#1f2937">• inner invoke 예외 격리</text>
  <text x="420" y="180" font-family="sans-serif" font-size="12" fill="#1f2937">• 반환값: 취소 여부 (boolean)</text>
  <rect x="410" y="210" width="190" height="130" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" />
  <text x="420" y="235" font-family="sans-serif" font-size="13" font-weight="bold" fill="#dc2626">수명 주기 제어</text>
  <text x="420" y="260" font-family="sans-serif" font-size="12" fill="#1f2937">• AbortController.abort()</text>
  <text x="420" y="280" font-family="sans-serif" font-size="12" fill="#1f2937">• 연결된 리스너 자동 제거</text>
  <text x="420" y="300" font-family="sans-serif" font-size="12" fill="#1f2937">• removeEventListener 대체</text>
  <text x="420" y="320" font-family="sans-serif" font-size="12" fill="#1f2937">• 메모리 누수 방지</text>
</svg>