<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280">
  <rect width="640" height="280" fill="#ffffff"/>
  <text x="30" y="32" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f2937">Prioritized Task Scheduling API 큐 구조 및 제어 체계</text>

  <!-- user-blocking queue -->
  <rect x="30" y="50" width="180" height="110" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <rect x="30" y="50" width="180" height="28" rx="6" fill="#dc2626"/>
  <text x="40" y="69" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">user-blocking (최상위)</text>
  <text x="42" y="98" font-family="sans-serif" font-size="12" fill="#1f2937">• 사용자 입력 반응</text>
  <text x="42" y="118" font-family="sans-serif" font-size="12" fill="#1f2937">• UI 차단 상호작용</text>
  <text x="42" y="138" font-family="sans-serif" font-size="12" fill="#1f2937">• 최우선 디스패치</text>

  <!-- user-visible queue -->
  <rect x="230" y="50" width="180" height="110" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="230" y="50" width="180" height="28" rx="6" fill="#2563eb"/>
  <text x="240" y="69" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">user-visible (기본값)</text>
  <text x="242" y="98" font-family="sans-serif" font-size="12" fill="#1f2937">• 화면 렌더링 작업</text>
  <text x="242" y="118" font-family="sans-serif" font-size="12" fill="#1f2937">• 일반 비동기 연산</text>
  <text x="242" y="138" font-family="sans-serif" font-size="12" fill="#1f2937">• 기본 UI 업데이트</text>

  <!-- background queue -->
  <rect x="430" y="50" width="180" height="110" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="430" y="50" width="180" height="28" rx="6" fill="#16a34a"/>
  <text x="440" y="69" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">background (최하위)</text>
  <text x="442" y="98" font-family="sans-serif" font-size="12" fill="#1f2937">• 로그 및 분석 전송</text>
  <text x="442" y="118" font-family="sans-serif" font-size="12" fill="#1f2937">• 데이터 프리페치</text>
  <text x="442" y="138" font-family="sans-serif" font-size="12" fill="#1f2937">• 유휴 시간 지연 처리</text>

  <!-- TaskController box -->
  <rect x="30" y="180" width="580" height="80" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="45" y="205" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">TaskController 및 TaskSignal 수명 주기 제어</text>
  <text x="45" y="230" font-family="sans-serif" font-size="12" fill="#2563eb">controller.setPriority('background') : 대기 중인 태스크 우선순위 동적 전이</text>
  <text x="45" y="248" font-family="sans-serif" font-size="12" fill="#dc2626">controller.abort() : AbortSignal 기반 큐 대기 태스크 즉시 취소 및 자원 해제</text>
</svg>