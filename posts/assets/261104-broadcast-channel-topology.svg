<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" width="640" height="370">
  <rect width="640" height="370" fill="#ffffff"/>
  
  <rect x="20" y="20" width="600" height="330" rx="8" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="35" y="42" font-family="sans-serif" font-size="13px" font-weight="bold" fill="#1f2937">동일 출처 영역 (Same-Origin: https://example.com)</text>
  
  <rect x="40" y="65" width="160" height="85" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="52" y="88" font-family="sans-serif" font-size="13px" font-weight="bold" fill="#2563eb">발신 탭 (Tab 1)</text>
  <text x="52" y="110" font-family="sans-serif" font-size="12px" fill="#1f2937">BroadcastChannel 인스턴스</text>
  <text x="52" y="130" font-family="sans-serif" font-size="12px" fill="#2563eb">postMessage(data)</text>
  
  <rect x="40" y="185" width="560" height="48" rx="6" fill="#2563eb"/>
  <text x="175" y="214" font-family="sans-serif" font-size="14px" font-weight="bold" fill="#ffffff">BroadcastChannel 버스 (채널 식별자: auth_sync)</text>
  
  <rect x="40" y="260" width="165" height="75" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="52" y="282" font-family="sans-serif" font-size="13px" font-weight="bold" fill="#16a34a">수신 탭 (Tab 2)</text>
  <text x="52" y="302" font-family="sans-serif" font-size="12px" fill="#1f2937">DOM manipulation task</text>
  <text x="52" y="322" font-family="sans-serif" font-size="12px" fill="#16a34a">onmessage 수신</text>
  
  <rect x="235" y="260" width="170" height="75" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="247" y="282" font-family="sans-serif" font-size="13px" font-weight="bold" fill="#16a34a">수신 iframe (동일 출처)</text>
  <text x="247" y="302" font-family="sans-serif" font-size="12px" fill="#1f2937">DOM manipulation task</text>
  <text x="247" y="322" font-family="sans-serif" font-size="12px" fill="#16a34a">onmessage 수신</text>
  
  <rect x="435" y="260" width="165" height="75" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="447" y="282" font-family="sans-serif" font-size="13px" font-weight="bold" fill="#16a34a">DedicatedWorker</text>
  <text x="447" y="302" font-family="sans-serif" font-size="12px" fill="#1f2937">백그라운드 스레드</text>
  <text x="447" y="322" font-family="sans-serif" font-size="12px" fill="#16a34a">onmessage 수신</text>
  
  <path d="M 120 150 L 120 185" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  
  <path d="M 122 233 L 122 260" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M 320 233 L 320 260" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M 517 233 L 517 260" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  
  <rect x="235" y="65" width="365" height="85" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="247" y="88" font-family="sans-serif" font-size="13px" font-weight="bold" fill="#dc2626">메시지 디스패치 규칙 (Eligible for messaging)</text>
  <text x="247" y="110" font-family="sans-serif" font-size="12px" fill="#1f2937">1. 발신 인스턴스 자신은 메시지 수신 대상에서 제외됨</text>
  <text x="247" y="130" font-family="sans-serif" font-size="12px" fill="#1f2937">2. 동일 출처 및 스토리지 키(Storage Key) 일치 채널에만 1:N 복제 전달</text>
  
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>