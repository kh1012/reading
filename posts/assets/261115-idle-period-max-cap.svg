<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" width="620" height="200">
  <rect width="620" height="200" fill="#ffffff"/>
  <text x="20" y="30" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f2937">렌더링 작업 부재 시 50ms 최대 상한선(Max Cap) 구조</text>
  <line x1="30" y1="90" x2="590" y2="90" stroke="#1f2937" stroke-width="2"/>
  <rect x="30" y="60" width="270" height="60" rx="4" fill="#16a34a"/>
  <text x="165" y="87" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">유휴 기간 (최대 50ms 할당)</text>
  <text x="165" y="105" font-family="sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">computeDeadline 알고리즘 상한선</text>
  <line x1="300" y1="50" x2="300" y2="130" stroke="#dc2626" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="300" y="145" font-family="sans-serif" font-size="12" fill="#dc2626" text-anchor="middle">마감 시각(Deadline, 최대 50ms)</text>
  <rect x="310" y="60" width="270" height="60" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="445" y="87" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">사용자 입력 큐 수신 및 반응 여유</text>
  <text x="445" y="105" font-family="sans-serif" font-size="12" fill="#2563eb" text-anchor="middle">RAIL 기준 100ms 이내 응답 보장</text>
  <text x="30" y="180" font-family="sans-serif" font-size="12" fill="#1f2937">대기 중인 렌더링이나 타이머가 없더라도 입력 반응성을 위해 마감 시각은 50ms로 제한된다.</text>
</svg>