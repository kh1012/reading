<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#16a34a" />
    </marker>
  </defs>
  <rect width="640" height="370" fill="#ffffff" />

  <text x="20" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#1f2937">Web Cryptography API 메모리 격리 및 보안 경계 모델</text>

  <rect x="20" y="45" width="285" height="195" rx="6" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5" />
  <text x="35" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">JavaScript 런타임 힙 (Origin Context)</text>

  <rect x="35" y="85" width="255" height="75" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1" />
  <text x="45" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1f2937">CryptoKey 인스턴스 (JS 참조 객체)</text>
  <text x="45" y="123" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1f2937">algorithm: AES-GCM (256-bit)</text>
  <text x="45" y="141" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">extractable: false (원시 키 추출 차단)</text>

  <rect x="35" y="170" width="255" height="55" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1" />
  <text x="45" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#2563eb">내부 슬롯: [[Handle]]</text>
  <text x="45" y="208" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1f2937">네이티브 키 저장소 참조 식별자 (Pointer)</text>

  <rect x="335" y="45" width="285" height="195" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
  <text x="350" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">브라우저 네이티브 보안 공간 (Native Memory)</text>

  <rect x="350" y="85" width="255" height="65" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1" />
  <text x="360" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#1f2937">격리된 원시 키 저장소 (Raw Key Bytes)</text>
  <text x="360" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#16a34a">AES 256비트 바이트 배열 / ECC 개인키</text>
  <text x="360" y="141" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1f2937">JS 런타임 힙 직접 접근 절대 불가</text>

  <rect x="350" y="160" width="255" height="65" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1" />
  <text x="360" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#1f2937">네이티브 엔진 (BoringSSL / NSS / CommonCrypto)</text>
  <text x="360" y="198" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1f2937">백그라운드 스레드 풀 비동기 연산</text>
  <text x="360" y="214" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#16a34a">AES-NI 하드웨어 가속 연산 적용</text>

  <path d="M 290 197 C 312 197, 315 117, 345 117" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)" />
  <text x="296" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#2563eb">격리 참조</text>

  <rect x="20" y="255" width="285" height="95" rx="6" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5" />
  <text x="35" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#1f2937">IndexedDB 영속화 (Storage)</text>
  <text x="35" y="298" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#16a34a">구조화된 복제(Structured Clone) 지원</text>
  <text x="35" y="316" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1f2937">CryptoKey 인스턴스 자체를 직접 영속화</text>
  <text x="35" y="334" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1f2937">원시 키 노출 없는 안전한 세션 간 재사용</text>

  <path d="M 162 160 L 162 247" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow-green)" />

  <rect x="335" y="255" width="285" height="95" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" />
  <text x="350" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">키 추출 차단 정책 (Security Policy)</text>
  <text x="350" y="298" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">subtle.exportKey() / wrapKey() 차단</text>
  <text x="350" y="316" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1f2937">호출 시 InvalidAccessError 예외 즉시 발생</text>
  <text x="350" y="334" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1f2937">XSS 환경에서도 원시 키 외부 반출 저지</text>
</svg>