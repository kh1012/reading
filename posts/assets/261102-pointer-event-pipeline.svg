<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280">
  <rect width="640" height="280" fill="#ffffff"/>
  <text x="20" y="30" font-family="sans-serif" font-size="14px" font-weight="bold" fill="#1f2937">Pointer Events 단일 파이프라인 통합 구조</text>
  
  <rect x="30" y="55" width="160" height="40" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="45" y="80" font-family="sans-serif" font-size="12px" fill="#1f2937">마우스 (좌표, 호버)</text>
  
  <rect x="240" y="55" width="160" height="40" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="250" y="80" font-family="sans-serif" font-size="12px" fill="#1f2937">터치 (다중접촉, ID)</text>
  
  <rect x="450" y="55" width="160" height="40" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="460" y="80" font-family="sans-serif" font-size="12px" fill="#1f2937">스타일러스 (압력, 기울기)</text>

  <line x1="110" y1="95" x2="110" y2="120" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="320" y1="95" x2="320" y2="120" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="530" y1="95" x2="530" y2="120" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="110" y1="120" x2="530" y2="120" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="320" y1="120" x2="320" y2="135" stroke="#1f2937" stroke-width="1.5"/>

  <rect x="80" y="135" width="480" height="65" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="160" font-family="sans-serif" font-size="13px" font-weight="bold" fill="#2563eb">단일 PointerEvent 파이프라인 (MouseEvent 상속)</text>
  <text x="100" y="185" font-family="sans-serif" font-size="12px" fill="#1f2937">pointerId | pointerType | pressure | tiltX, tiltY | touch-action 판정</text>

  <line x1="320" y1="200" x2="320" y2="225" stroke="#2563eb" stroke-width="2"/>
  <polygon points="315,225 325,225 320,233" fill="#2563eb"/>

  <rect x="150" y="235" width="340" height="35" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="165" y="258" font-family="sans-serif" font-size="12px" font-weight="bold" fill="#16a34a">타깃 DOM: pointerdown / move / up / cancel 수신</text>
</svg>