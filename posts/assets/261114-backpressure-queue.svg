<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250">
  <rect width="640" height="250" fill="#ffffff"/>

  <!-- Formula Bar -->
  <rect x="20" y="15" width="600" height="38" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="320" y="39" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="middle">controller.desiredSize = highWaterMark - queueTotalSize</text>

  <!-- Left: State A (Normal Pulling) -->
  <rect x="20" y="70" width="285" height="160" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="162" y="98" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">여유 버퍼 확보 (desiredSize &gt; 0)</text>
  
  <rect x="40" y="115" width="245" height="24" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
  <rect x="40" y="115" width="90" height="24" rx="4" fill="#2563eb"/>
  <text x="85" y="131" font-family="sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">queue (35%)</text>
  <text x="210" y="131" font-family="sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">highWaterMark</text>

  <text x="162" y="165" font-family="sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">ShouldCallPull 알고리즘: true</text>
  <text x="162" y="195" font-family="sans-serif" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="middle">pull() 호출 지속 (데이터 생산)</text>

  <!-- Right: State B (Backpressure Triggered) -->
  <rect x="335" y="70" width="285" height="160" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="477" y="98" font-family="sans-serif" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">버퍼 한계 도달 (desiredSize &lt;= 0)</text>

  <rect x="355" y="115" width="245" height="24" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
  <rect x="355" y="115" width="245" height="24" rx="4" fill="#dc2626"/>
  <text x="477" y="131" font-family="sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">queue (100% 포화)</text>

  <text x="477" y="165" font-family="sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">ShouldCallPull 알고리즘: false</text>
  <text x="477" y="195" font-family="sans-serif" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">pull() 호출 중단 (역압 발생 · 대기)</text>
</svg>