<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <rect width="640" height="320" fill="#ffffff" />
  <text x="20" y="35" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f2937">HTTP, MCP, file 스킴의 아키텍처 구조 비교</text>
  <rect x="20" y="55" width="190" height="240" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4" />
  <text x="35" y="80" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb">HTTP (RFC 9110)</text>
  <text x="35" y="105" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937">분류: 응용 통신 프로토콜</text>
  <text x="35" y="130" font-family="sans-serif" font-size="12" fill="#1f2937">규약 핵심:</text>
  <text x="35" y="150" font-family="sans-serif" font-size="12" fill="#1f2937">- 메서드 (GET, POST)</text>
  <text x="35" y="170" font-family="sans-serif" font-size="12" fill="#1f2937">- 상태 코드 (200, 404)</text>
  <text x="35" y="190" font-family="sans-serif" font-size="12" fill="#1f2937">- 헤더 규약 (Cookie 등)</text>
  <text x="35" y="220" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937">하부 전송 통로:</text>
  <text x="35" y="240" font-family="sans-serif" font-size="12" fill="#1f2937">- TCP (HTTP/1.1, 2)</text>
  <text x="35" y="260" font-family="sans-serif" font-size="12" fill="#1f2937">- QUIC/UDP (HTTP/3)</text>
  <rect x="225" y="55" width="190" height="240" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" rx="4" />
  <text x="240" y="80" font-family="sans-serif" font-size="13" font-weight="bold" fill="#16a34a">MCP</text>
  <text x="240" y="105" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937">분류: 도구 연동 프로토콜</text>
  <text x="240" y="130" font-family="sans-serif" font-size="12" fill="#1f2937">규약 핵심:</text>
  <text x="240" y="150" font-family="sans-serif" font-size="12" fill="#1f2937">- JSON-RPC 2.0 포맷</text>
  <text x="240" y="170" font-family="sans-serif" font-size="12" fill="#1f2937">- tools/call 메서드</text>
  <text x="240" y="190" font-family="sans-serif" font-size="12" fill="#1f2937">- 리소스 및 프롬프트 제어</text>
  <text x="240" y="220" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937">하부 전송 통로:</text>
  <text x="240" y="240" font-family="sans-serif" font-size="12" fill="#1f2937">- 로컬 OS stdio 파이프</text>
  <text x="240" y="260" font-family="sans-serif" font-size="12" fill="#1f2937">- 원격 Streamable HTTP</text>
  <rect x="430" y="55" width="190" height="240" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" rx="4" />
  <text x="445" y="80" font-family="sans-serif" font-size="13" font-weight="bold" fill="#dc2626">file: (RFC 8089)</text>
  <text x="445" y="105" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937">분류: 자원 식별 URI 스킴</text>
  <text x="445" y="130" font-family="sans-serif" font-size="12" fill="#1f2937">특성 및 메커니즘:</text>
  <text x="445" y="150" font-family="sans-serif" font-size="12" fill="#1f2937">- 통신 프로토콜 아님</text>
  <text x="445" y="170" font-family="sans-serif" font-size="12" fill="#1f2937">- 네트워크 패킷 교환 없음</text>
  <text x="445" y="190" font-family="sans-serif" font-size="12" fill="#1f2937">- 로컬 절대 경로 식별</text>
  <text x="445" y="220" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937">접근 인터페이스:</text>
  <text x="445" y="240" font-family="sans-serif" font-size="12" fill="#1f2937">- OS 커널 VFS 계층</text>
  <text x="445" y="260" font-family="sans-serif" font-size="12" fill="#1f2937">- open, read 시스템 콜</text>
</svg>