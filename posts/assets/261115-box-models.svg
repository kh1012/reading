<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="320">
  <rect width="600" height="320" fill="#ffffff" />
  <rect x="40" y="30" width="520" height="250" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="6,4" rx="4" />
  <text x="55" y="55" font-family="sans-serif" font-size="13px" font-weight="bold" fill="#2563eb">border-box 관찰 영역 (borderBoxSize: border + padding + content)</text>
  
  <rect x="100" y="80" width="400" height="160" fill="#f8fafc" stroke="#16a34a" stroke-width="2" rx="4" />
  <text x="115" y="105" font-family="sans-serif" font-size="13px" font-weight="bold" fill="#16a34a">content-box 관찰 영역 (contentBoxSize: 순수 콘텐츠 영역, 기본값)</text>
  
  <line x1="110" y1="160" x2="490" y2="160" stroke="#1f2937" stroke-width="1.5" />
  <polygon points="110,160 118,156 118,164" fill="#1f2937" />
  <polygon points="490,160 482,156 482,164" fill="#1f2937" />
  <text x="300" y="152" text-anchor="middle" font-family="sans-serif" font-size="12px" fill="#1f2937">inlineSize (writing-mode: horizontal-tb 기준 너비)</text>
  
  <line x1="440" y1="90" x2="440" y2="230" stroke="#1f2937" stroke-width="1.5" />
  <polygon points="440,90 436,98 444,98" fill="#1f2937" />
  <polygon points="440,230 436,222 444,222" fill="#1f2937" />
  <text x="448" y="165" font-family="sans-serif" font-size="12px" fill="#1f2937">blockSize</text>
  
  <text x="55" y="270" font-family="sans-serif" font-size="12px" fill="#dc2626">인라인 비대체 요소(span 등): 박스 미형성으로 관찰 제외</text>
  <text x="350" y="270" font-family="sans-serif" font-size="12px" fill="#1f2937">배열(sequence) 반환: Multi-column 단편 지원</text>
</svg>