<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="320">
  <rect width="600" height="320" fill="#ffffff"/>
  <text x="300" y="28" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">View Transitions 의사 요소 트리 계층 구조</text>
  
  <rect x="180" y="50" width="240" height="38" rx="6" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/>
  <text x="300" y="74" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="middle">::view-transition</text>
  
  <line x1="300" y1="88" x2="300" y2="115" stroke="#1f2937" stroke-width="1.5"/>
  
  <rect x="160" y="115" width="280" height="38" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="300" y="139" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">::view-transition-group(name)</text>
  
  <line x1="300" y1="153" x2="300" y2="180" stroke="#2563eb" stroke-width="1.5"/>
  
  <rect x="150" y="180" width="300" height="38" rx="6" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="300" y="204" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="middle">::view-transition-image-pair(name)</text>
  
  <line x1="220" y1="218" x2="160" y2="245" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="380" y1="218" x2="440" y2="245" stroke="#1f2937" stroke-width="1.5"/>
  
  <rect x="50" y="245" width="220" height="44" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="160" y="267" font-family="sans-serif" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">::view-transition-old(name)</text>
  <text x="160" y="281" font-family="sans-serif" font-size="11" fill="#dc2626" text-anchor="middle">(이전 상태 비트맵 스냅샷)</text>
  
  <rect x="330" y="245" width="220" height="44" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="440" y="267" font-family="sans-serif" font-size="12" font-weight="bold" fill="#16a34a" text-anchor="middle">::view-transition-new(name)</text>
  <text x="440" y="281" font-family="sans-serif" font-size="11" fill="#16a34a" text-anchor="middle">(신규 상태 실시간 뷰/스냅샷)</text>
</svg>