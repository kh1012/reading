<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" width="620" height="320">
  <rect width="620" height="320" fill="#ffffff" />
  <text x="310" y="32" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">Trusted Types 런타임 제어 및 타입 거버넌스 구조</text>
  
  <!-- Raw String Box -->
  <rect x="30" y="65" width="160" height="65" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5" />
  <text x="110" y="93" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="middle">원시 문자열 (DOMString)</text>
  <text x="110" y="113" font-family="sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">검증되지 않은 사용자 입력</text>

  <!-- Blocked Path (Upper) -->
  <line x1="190" y1="95" x2="385" y2="95" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,4" />
  <polygon points="385,90 395,95 385,100" fill="#dc2626" />
  <rect x="235" y="73" width="115" height="22" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1" />
  <text x="292" y="88" font-family="sans-serif" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">직접 할당 차단</text>

  <!-- TypeError Box -->
  <rect x="395" y="65" width="195" height="65" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" />
  <text x="492" y="93" font-family="sans-serif" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">TypeError 예외 발생</text>
  <text x="492" y="113" font-family="sans-serif" font-size="12" fill="#dc2626" text-anchor="middle">DOM 인젝션 싱크 주입 거부</text>

  <!-- Arrow down to Policy -->
  <line x1="110" y1="130" x2="110" y2="185" stroke="#2563eb" stroke-width="2" />
  <polygon points="105,185 110,195 115,185" fill="#2563eb" />

  <!-- Policy Box -->
  <rect x="30" y="195" width="220" height="85" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />
  <text x="140" y="222" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">TrustedTypePolicy</text>
  <text x="140" y="244" font-family="sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">createPolicy(name, options)</text>
  <text x="140" y="264" font-family="sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">DOMPurify 살균 및 출처 검증</text>

  <!-- Arrow to Trusted Object -->
  <line x1="250" y1="237" x2="295" y2="237" stroke="#16a34a" stroke-width="2" />
  <polygon points="295,232 305,237 295,242" fill="#16a34a" />

  <!-- Trusted Objects Box -->
  <rect x="305" y="195" width="145" height="85" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" />
  <text x="377" y="220" font-family="sans-serif" font-size="12" font-weight="bold" fill="#16a34a" text-anchor="middle">TrustedHTML</text>
  <text x="377" y="242" font-family="sans-serif" font-size="12" font-weight="bold" fill="#16a34a" text-anchor="middle">TrustedScript / ScriptURL</text>
  <text x="377" y="264" font-family="sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">캡슐화된 불변 객체</text>

  <!-- Arrow to Sink -->
  <line x1="450" y1="237" x2="480" y2="237" stroke="#16a34a" stroke-width="2" />
  <polygon points="480,232 490,237 480,242" fill="#16a34a" />

  <!-- Sink Box -->
  <rect x="490" y="195" width="100" height="85" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5" />
  <text x="540" y="222" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="middle">DOM Sink</text>
  <text x="540" y="244" font-family="sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">innerHTML</text>
  <text x="540" y="264" font-family="sans-serif" font-size="12" font-weight="bold" fill="#16a34a" text-anchor="middle">정상 실행</text>

  <!-- Bottom Label -->
  <text x="310" y="305" font-family="sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">CSP: require-trusted-types-for 'script' 활성화 상태의 WebIDL 타입 검증 흐름</text>
</svg>