<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" width="620" height="340">
  <rect width="620" height="340" fill="#ffffff"/>
  <rect x="20" y="20" width="580" height="300" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="40" y="50" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f2937">WeakRef 메모리 참조 구조와 AddToKeptObjects 메커니즘</text>
  
  <rect x="40" y="80" width="160" height="60" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="50" y="105" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">강한 참조 (변수/프로퍼티)</text>
  <text x="50" y="125" font-family="sans-serif" font-size="12" fill="#dc2626">GC 회수 차단 (Reachable)</text>

  <rect x="40" y="170" width="160" height="60" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="50" y="195" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb">new WeakRef(target)</text>
  <text x="50" y="215" font-family="sans-serif" font-size="12" fill="#2563eb">약한 참조 (GC 허용)</text>

  <rect x="260" y="120" width="140" height="80" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="280" y="150" font-family="sans-serif" font-size="14" font-weight="bold" fill="#16a34a">Target Object</text>
  <text x="275" y="175" font-family="sans-serif" font-size="12" fill="#1f2937">메모리 힙 상주 객체</text>

  <rect x="450" y="110" width="140" height="100" rx="6" fill="#ffffff" stroke="#2563eb" stroke-dasharray="4 4" stroke-width="1.5"/>
  <text x="460" y="135" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2563eb">Kept Objects 목록</text>
  <text x="460" y="155" font-family="sans-serif" font-size="12" fill="#1f2937">AddToKeptObjects</text>
  <text x="460" y="175" font-family="sans-serif" font-size="12" fill="#16a34a">현재 Job 동안 유지</text>
  <text x="460" y="195" font-family="sans-serif" font-size="12" fill="#dc2626">Job 종료 시 비워짐</text>

  <line x1="200" y1="110" x2="260" y2="140" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="260,140 250,135 252,143" fill="#1f2937"/>

  <line x1="200" y1="200" x2="260" y2="170" stroke="#2563eb" stroke-dasharray="4 4" stroke-width="1.5"/>
  <polygon points="260,170 250,167 252,175" fill="#2563eb"/>

  <line x1="400" y1="160" x2="450" y2="160" stroke="#2563eb" stroke-width="1.5"/>
  <polygon points="450,160 442,156 442,164" fill="#2563eb"/>
  <text x="408" y="150" font-family="sans-serif" font-size="12" fill="#2563eb">deref()</text>

  <rect x="40" y="250" width="540" height="50" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
  <text x="50" y="270" font-family="sans-serif" font-size="12" fill="#1f2937">1. WeakRef는 객체 수거를 막지 않으나 deref() 시 AddToKeptObjects로 당해 실행 Job 동안 강하게 유지됩니다.</text>
  <text x="50" y="288" font-family="sans-serif" font-size="12" fill="#dc2626">2. 강한 참조가 없고 Job이 종료되면 가비지 컬렉터(GC)에 의해 힙 메모리에서 수거될 수 있습니다.</text>
</svg>