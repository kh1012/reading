<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300">
  <rect width="640" height="300" fill="#ffffff"/>

  <rect x="20" y="20" width="285" height="260" rx="8" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <text x="35" y="44" font-family="sans-serif" font-size="13px" font-weight="bold" fill="#2563eb">최상위 사이트 A (https://site-a.example)</text>
  
  <rect x="35" y="60" width="255" height="85" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
  <text x="47" y="82" font-family="sans-serif" font-size="12px" font-weight="bold" fill="#1f2937">임베디드 iframe (https://widget.example)</text>
  <text x="47" y="104" font-family="sans-serif" font-size="12px" fill="#1f2937">Storage Key: {site-a, widget}</text>
  <text x="47" y="126" font-family="sans-serif" font-size="12px" fill="#2563eb">BroadcastChannel("sync")</text>

  <rect x="35" y="165" width="255" height="95" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
  <text x="47" y="187" font-family="sans-serif" font-size="12px" font-weight="bold" fill="#16a34a">동일 최상위 사이트 내 다른 탭 / 프레임</text>
  <text x="47" y="209" font-family="sans-serif" font-size="12px" fill="#1f2937">Storage Key: {site-a, widget}</text>
  <text x="47" y="231" font-family="sans-serif" font-size="12px" fill="#16a34a">통신 가능 (메시지 수신 정상 동작)</text>

  <rect x="335" y="20" width="285" height="260" rx="8" fill="none" stroke="#1f2937" stroke-width="1.5"/>
  <text x="350" y="44" font-family="sans-serif" font-size="13px" font-weight="bold" fill="#1f2937">최상위 사이트 B (https://site-b.example)</text>

  <rect x="350" y="60" width="255" height="85" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
  <text x="362" y="82" font-family="sans-serif" font-size="12px" font-weight="bold" fill="#dc2626">임베디드 iframe (https://widget.example)</text>
  <text x="362" y="104" font-family="sans-serif" font-size="12px" fill="#1f2937">Storage Key: {site-b, widget}</text>
  <text x="362" y="126" font-family="sans-serif" font-size="12px" fill="#dc2626">BroadcastChannel("sync")</text>

  <rect x="350" y="165" width="255" height="95" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
  <text x="362" y="187" font-family="sans-serif" font-size="12px" font-weight="bold" fill="#dc2626">이중 키잉(Double-keyed) 파티셔닝 격리</text>
  <text x="362" y="209" font-family="sans-serif" font-size="12px" fill="#1f2937">동일한 출처라도 상위 사이트가 다르면</text>
  <text x="362" y="231" font-family="sans-serif" font-size="12px" fill="#dc2626">메시지 전달 완전 차단 (destinations 배제)</text>

  <path d="M 290 102 L 350 102" stroke="#dc2626" stroke-width="2" stroke-dasharray="3 3"/>
  <circle cx="320" cy="102" r="9" fill="#dc2626"/>
  <text x="315" y="107" font-family="sans-serif" font-size="13px" font-weight="bold" fill="#ffffff">X</text>
</svg>