<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380">
  <rect width="640" height="380" fill="#ffffff" rx="8" />
  
  <text x="320" y="28" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">PerformanceObserver 브라우저 내부 큐잉 및 디스패치 구조</text>
  
  <!-- Step 1: Subsystems -->
  <rect x="20" y="45" width="600" height="52" fill="#f9fafb" stroke="#1f2937" stroke-width="1.5" rx="6" />
  <text x="320" y="66" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="middle">브라우저 하위 시스템 (Browser Subsystems)</text>
  <text x="320" y="84" font-family="sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">Rendering Pipeline (Layout/Paint) · Network Stack · HTML Parser</text>
  
  <!-- Arrow Down -->
  <line x1="320" y1="97" x2="320" y2="120" stroke="#1f2937" stroke-width="1.5" />
  <polygon points="316,120 320,128 324,120" fill="#1f2937" />
  <text x="330" y="115" font-family="sans-serif" font-size="12" fill="#2563eb">Queue a PerformanceEntry</text>
  
  <!-- Step 2: Queue Control & Event Loop -->
  <rect x="20" y="132" width="285" height="100" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="6" />
  <text x="162" y="152" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">1. 전역 큐 플래그 제어</text>
  <text x="162" y="172" font-family="sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">performance observer task queued flag</text>
  <text x="162" y="193" font-family="sans-serif" font-size="12" fill="#16a34a" text-anchor="middle">flag == false : flag=true 설정 및 태스크 큐잉</text>
  <text x="162" y="214" font-family="sans-serif" font-size="12" fill="#dc2626" text-anchor="middle">flag == true : 중복 태스크 스케줄링 생략</text>
  
  <rect x="335" y="132" width="285" height="100" fill="#f9fafb" stroke="#1f2937" stroke-width="1.5" rx="6" />
  <text x="477" y="152" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="middle">2. WHATWG HTML 이벤트 루프</text>
  <text x="477" y="172" font-family="sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">performance timeline task source</text>
  <text x="477" y="193" font-family="sans-serif" font-size="12" fill="#2563eb" text-anchor="middle">매크로태스크(Macrotask) 대기열 적재</text>
  <text x="477" y="214" font-family="sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">렌더링 완료 후 다음 턴에서 실행</text>
  
  <!-- Arrow to Step 3 -->
  <line x1="320" y1="232" x2="320" y2="255" stroke="#1f2937" stroke-width="1.5" />
  <polygon points="316,255 320,263 324,255" fill="#1f2937" />
  <text x="330" y="250" font-family="sans-serif" font-size="12" fill="#1f2937">태스크 디스패치 턴</text>
  
  <!-- Step 3: Dispatch & Empty -->
  <rect x="20" y="267" width="600" height="98" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" rx="6" />
  <text x="320" y="287" font-family="sans-serif" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="middle">3. 관찰자 버퍼 복제 및 디스패치 파이프라인</text>
  <text x="40" y="309" font-family="sans-serif" font-size="12" fill="#1f2937">① performance observer task queued flag = false 로 재설정</text>
  <text x="40" y="327" font-family="sans-serif" font-size="12" fill="#2563eb">② 각 관찰자의 po's observer buffer 복제 → PerformanceObserverEntryList 객체 생성</text>
  <text x="40" y="345" font-family="sans-serif" font-size="12" fill="#16a34a">③ empty po's observer buffer (관찰자 내부 버퍼 즉시 초기화) → 콜백 (entries, observer, options) 비동기 실행</text>
</svg>