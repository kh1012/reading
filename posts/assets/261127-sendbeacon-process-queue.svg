  <text x="385" y="198" font-family="sans-serif" font-size="12" fill="#2563eb">렌더러 종료와 무관하게 전송 유지</text>
  <path d="M 490 215 L 490 235" stroke="#16a34a" stroke-width="1.5"/>
  <polygon points="486,235 490,243 494,235" fill="#16a34a"/>
  <rect x="375" y="245" width="230" height="45" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="385" y="272" font-family="sans-serif" font-size="12" font-weight="bold" fill="#16a34a">원격 텔레메트리 서버로 발송</text>
</svg>