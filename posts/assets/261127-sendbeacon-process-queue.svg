  <text x="45" y="181" font-family="sans-serif" font-size="12" fill="#16a34a">즉시 동기 반환: true / false</text>
  <rect x="35" y="208" width="230" height="72" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="45" y="231" font-family="sans-serif" font-size="12" font-weight="bold" fill="#dc2626">Document 컨텍스트 언로드</text>
  <text x="45" y="250" font-family="sans-serif" font-size="12" fill="#dc2626">렌더러 메모리 해제 및 스레드 종료</text>
  <text x="45" y="268" font-family="sans-serif" font-size="12" fill="#1f2937">JS 실행 환경 완전 파괴</text>

  <path d="M 280 167 L 350 167" stroke="#2563eb" stroke-width="2"/>
  <polygon points="350,162 360,167 350,172" fill="#2563eb"/>
  <text x="286" y="157" font-family="sans-serif" font-size="12" fill="#2563eb">IPC 큐 적재</text>

  <rect x="360" y="20" width="260" height="280" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="375" y="48" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f2937">브라우저 네트워크 프로세스</text>
  <rect x="375" y="65" width="230" height="60" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="385" y="88" font-family="sans-serif" font-size="12" font-weight="bold" fill="#16a34a">내부 전송 대기열 (Queue)</text>
  <text x="385" y="108" font-family="sans-serif" font-size="12" fill="#1f2937">keepalive 요청 등록 (최대 64KiB)</text>
  <path d="M 490 125 L 490 145" stroke="#16a34a" stroke-width="1.5"/>
  <polygon points="486,145 490,153 494,145" fill="#16a34a"/>
  <rect x="375" y="155" width="230" height="60" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
