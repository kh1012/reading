<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <rect width="640" height="320" fill="#ffffff"/>
  <rect x="20" y="20" width="260" height="280" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="35" y="48" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f2937">렌더러 프로세스 (JS 실행 컨텍스트)</text>
  <rect x="35" y="65" width="230" height="50" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
  <text x="45" y="86" font-family="sans-serif" font-size="12" fill="#1f2937">이벤트 발생: visibilitychange</text>
  <text x="45" y="104" font-family="sans-serif" font-size="12" fill="#2563eb">document.visibilityState === 'hidden'</text>
  <path d="M 150 115 L 150 135" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="146,133 150,141 154,133" fill="#1f2937"/>
  <rect x="35" y="142" width="230" height="50" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
