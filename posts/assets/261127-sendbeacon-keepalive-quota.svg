<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280">
  <rect width="640" height="280" fill="#ffffff"/>
  <text x="25" y="38" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f2937">WHATWG Fetch keepalive 메모리 쿼터 한도 (브라우저 fetch 그룹당)</text>
  <rect x="25" y="60" width="590" height="45" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <rect x="27" y="62" width="280" height="41" rx="4" fill="#2563eb" opacity="0.85"/>
  <text x="40" y="87" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">활성 keepalive 페이로드 합산 (In-flight 바이트)</text>
  <rect x="307" y="62" width="170" height="41" fill="#16a34a" opacity="0.85"/>
  <text x="320" y="87" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">가용 잔여 버퍼</text>
  <rect x="477" y="62" width="136" height="41" rx="4" fill="#dc2626" opacity="0.85"/>
  <text x="490" y="87" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">초과 영역 (거부)</text>
  <line x1="477" y1="50" x2="477" y2="120" stroke="#dc2626" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="410" y="135" font-family="sans-serif" font-size="12" font-weight="bold" fill="#dc2626">64KiB 임계치 (65,536 Bytes)</text>

  <rect x="25" y="155" width="285" height="105" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="38" y="180" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2563eb">쿼터 내 정상 등록 (true 반환)</text>
  <text x="38" y="202" font-family="sans-serif" font-size="12" fill="#1f2937">- 페이로드 합산 &lt;= 64KiB</text>
  <text x="38" y="222" font-family="sans-serif" font-size="12" fill="#1f2937">- 브라우저 전송 대기열 즉시 적재</text>
  <text x="38" y="242" font-family="sans-serif" font-size="12" fill="#16a34a">- 언로드 후에도 백그라운드 전송 보장</text>

  <rect x="330" y="155" width="285" height="105" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="343" y="180" font-family="sans-serif" font-size="12" font-weight="bold" fill="#dc2626">쿼터 초과 시 폐기 (false 반환)</text>
  <text x="343" y="202" font-family="sans-serif" font-size="12" fill="#1f2937">- 페이로드 합산 &gt; 64KiB</text>
  <text x="343" y="222" font-family="sans-serif" font-size="12" fill="#dc2626">- navigator.sendBeacon() 호출 즉시 실패</text>
  <text x="343" y="242" font-family="sans-serif" font-size="12" fill="#1f2937">- 요청 자체가 큐에 들어가지 않고 폐기</text>
</svg>