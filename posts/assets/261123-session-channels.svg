<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect x="15" y="15" width="610" height="290" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="30" y="42" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f2937">WebTransport 세션 (HTTP/3 / QUIC 세션)</text>
  <line x1="30" y1="52" x2="610" y2="52" stroke="#e5e7eb" stroke-width="1"/>
  
  <rect x="30" y="65" width="580" height="65" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="45" y="88" font-family="sans-serif" font-size="13" font-weight="bold" fill="#16a34a">1. Datagrams (비신뢰성 · 비순서 패킷 전송 채널)</text>
  <text x="45" y="106" font-family="sans-serif" font-size="12" fill="#1f2937">• transport.datagrams.readable / transport.datagrams.writable</text>
  <text x="45" y="122" font-family="sans-serif" font-size="12" fill="#1f2937">• 재전송 없음 · 순서 보장 없음 · 최소 지연 패킷 전달 · MTU 제한 (약 1,200바이트)</text>

  <rect x="30" y="140" width="580" height="65" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="45" y="163" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb">2. Unidirectional Streams (단방향 스트림 · 신뢰성 · 순서 보장)</text>
  <text x="45" y="181" font-family="sans-serif" font-size="12" fill="#1f2937">• 송신: createUnidirectionalStream() | 수신: incomingUnidirectionalStreams</text>
  <text x="45" y="197" font-family="sans-serif" font-size="12" fill="#1f2937">• 독립 바이트 스트림 · W3C Streams API 결합 · 내장 백프레셔(Backpressure)</text>

  <rect x="30" y="215" width="580" height="75" rx="6" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/>
  <text x="45" y="238" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">3. Bidirectional Streams (양방향 스트림 · 신뢰성 · 전이중)</text>
  <text x="45" y="256" font-family="sans-serif" font-size="12" fill="#1f2937">• 생성: createBidirectionalStream() | 수신: incomingBidirectionalStreams</text>
  <text x="45" y="272" font-family="sans-serif" font-size="12" fill="#1f2937">• readable(ReadableStream) + writable(WritableStream) 전이중(Full-Duplex) 파이프라인</text>
  <text x="45" y="286" font-family="sans-serif" font-size="12" fill="#1f2937">• Web Worker 지원(Exposed=(Window, Worker))으로 main-thread blocking 방지</text>
</svg>