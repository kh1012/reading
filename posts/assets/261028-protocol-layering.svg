<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <rect width="640" height="320" fill="#ffffff" />
  <rect x="20" y="20" width="600" height="280" fill="none" stroke="#1f2937" stroke-width="1.5" rx="6" />
  <text x="35" y="45" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f2937">컴퓨터 네트워크 계층 분리 모델 (RFC 1122)</text>
  <rect x="40" y="65" width="560" height="90" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4" />
  <text x="55" y="90" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb">응용 계층 프로토콜 규약 (Protocol Semantics)</text>
  <text x="55" y="112" font-family="sans-serif" font-size="12" fill="#1f2937">수평적 피어(Peer) 규약: 구문(Syntax), 의미(Semantics), 타이밍(Timing) 정의</text>
  <text x="55" y="132" font-family="sans-serif" font-size="12" fill="#1f2937">적용 예: HTTP Semantics (RFC 9110), MCP JSON-RPC 2.0 (도구 호출 규약)</text>
  <line x1="40" y1="175" x2="600" y2="175" stroke="#1f2937" stroke-width="1" stroke-dasharray="4,4" />
  <text x="180" y="171" font-family="sans-serif" font-size="12" fill="#dc2626">수직적 서비스 인터페이스 (Service Interface / 시스템 콜 API)</text>
  <rect x="40" y="195" width="560" height="85" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" rx="4" />
  <text x="55" y="220" font-family="sans-serif" font-size="13" font-weight="bold" fill="#16a34a">하부 전송 통로 (Transport / Channel)</text>
  <text x="55" y="242" font-family="sans-serif" font-size="12" fill="#1f2937">단순 바이트 전달 매체: 바이트 경계 및 데이터 의미를 해석하지 않음</text>
  <text x="55" y="262" font-family="sans-serif" font-size="12" fill="#1f2937">매체 종류: TCP 연결 소켓, UDP/QUIC 스트림, OS stdio 표준 입출력 파이프</text>
</svg>