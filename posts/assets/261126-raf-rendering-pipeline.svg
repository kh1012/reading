<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <rect width="640" height="360" fill="#ffffff"/>
  <rect x="30" y="20" width="580" height="46" rx="6" fill="#f3f4f6" stroke="#1f2937" stroke-width="1.5"/>
  <text x="320" y="48" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="middle">매크로 태스크 (Task) 실행 완료 → 마이크로태스크 큐 (Microtasks) 소진</text>
  
  <line x1="320" y1="66" x2="320" y2="92" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#1f2937"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="30" y="94" width="580" height="186" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="50" y="120" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb">Update the rendering (렌더링 갱신 단계 / V-Sync 주기)</text>
  
  <rect x="45" y="136" width="100" height="126" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.2"/>
  <text x="95" y="166" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">1. 문서 필터링</text>
  <text x="95" y="194" font-family="sans-serif" font-size="11" fill="#1f2937" text-anchor="middle">ResizeObserver</text>
  <text x="95" y="214" font-family="sans-serif" font-size="11" fill="#1f2937" text-anchor="middle">스크롤 평가</text>

  <line x1="145" y1="199" x2="160" y2="199" stroke="#1f2937" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="160" y="136" width="112" height="126" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="216" y="164" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="middle">2. rAF 콜백</text>
  <text x="216" y="186" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1f2937" text-anchor="middle">스냅샷 순회</text>
  <text x="216" y="208" font-family="sans-serif" font-size="11" fill="#1f2937" text-anchor="middle">DOM 쓰기 예약</text>
  <text x="216" y="230" font-family="sans-serif" font-size="10" fill="#2563eb" text-anchor="middle">(재귀 등록은 이월)</text>

  <line x1="272" y1="199" x2="287" y2="199" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <rect x="287" y="136" width="104" height="126" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="339" y="164" font-family="sans-serif" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">3. 스타일·레이아웃</text>
  <text x="339" y="188" font-family="sans-serif" font-size="11" fill="#1f2937" text-anchor="middle">Style 재계산</text>
  <text x="339" y="210" font-family="sans-serif" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">Reflow 실행</text>
  <text x="339" y="232" font-family="sans-serif" font-size="10" fill="#1f2937" text-anchor="middle">(일괄 배칭 처리)</text>

  <line x1="391" y1="199" x2="406" y2="199" stroke="#1f2937" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="406" y="136" width="104" height="126" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.2"/>
  <text x="458" y="164" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">4. 교차 관찰</text>
  <text x="458" y="190" font-family="sans-serif" font-size="11" fill="#1f2937" text-anchor="middle">Intersection</text>
  <text x="458" y="210" font-family="sans-serif" font-size="11" fill="#1f2937" text-anchor="middle">Observer flush</text>
  <text x="458" y="232" font-family="sans-serif" font-size="10" fill="#1f2937" text-anchor="middle">(entries 생성)</text>

  <line x1="510" y1="199" x2="525" y2="199" stroke="#1f2937" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="525" y="136" width="75" height="126" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="562" y="164" font-family="sans-serif" font-size="12" font-weight="bold" fill="#16a34a" text-anchor="middle">5. 페인트</text>
  <text x="562" y="192" font-family="sans-serif" font-size="11" fill="#1f2937" text-anchor="middle">Paint</text>
  <text x="562" y="214" font-family="sans-serif" font-size="11" fill="#1f2937" text-anchor="middle">Composite</text>

  <rect x="30" y="294" width="580" height="46" rx="6" fill="#f8fafc" stroke="#1f2937" stroke-width="1.2"/>
  <text x="320" y="322" font-family="sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">rAF 콜백은 스타일 재계산·레이아웃 직전에 실행되므로 DOM 수정을 단 1회 리플로우로 일괄 처리함</text>
</svg>