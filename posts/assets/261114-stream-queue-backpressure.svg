<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260">
  <rect width="640" height="260" fill="#ffffff"/>
  <rect x="30" y="20" width="580" height="42" rx="4" fill="#f8fafc" stroke="#1f2937" stroke-width="1"/>
  <text x="320" y="46" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="middle">desiredSize = highWaterMark - queueTotalSize</text>

  <rect x="30" y="80" width="275" height="155" rx="6" fill="#f8fafc" stroke="#16a34a" stroke-width="1.5"/>
  <text x="167" y="105" font-family="sans-serif" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="middle">1. 여유 버퍼 (desiredSize &gt; 0)</text>
  <rect x="50" y="125" width="235" height="24" rx="3" fill="#e2e8f0"/>
  <rect x="50" y="125" width="80" height="24" rx="3" fill="#2563eb"/>
  <text x="90" y="141" font-family="sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Queue: 1</text>
  <text x="220" y="141" font-family="sans-serif" font-size="11" fill="#1f2937" text-anchor="middle">HWM: 3</text>
  <text x="167" y="172" font-family="sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">desiredSize = 3 - 1 = +2</text>
  <text x="167" y="196" font-family="sans-serif" font-size="12" font-weight="bold" fill="#16a34a" text-anchor="middle">pull(controller) 자동 호출</text>
  <text x="167" y="216" font-family="sans-serif" font-size="11" fill="#1f2937" text-anchor="middle">생산자 청크 공급 허용</text>

  <rect x="335" y="80" width="275" height="155" rx="6" fill="#f8fafc" stroke="#dc2626" stroke-width="1.5"/>
  <text x="472" y="105" font-family="sans-serif" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">2. 버퍼 포화 (desiredSize &lt;= 0)</text>
  <rect x="355" y="125" width="235" height="24" rx="3" fill="#e2e8f0"/>
  <rect x="355" y="125" width="235" height="24" rx="3" fill="#dc2626"/>
  <text x="472" y="141" font-family="sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Queue: 3 / HWM: 3</text>
  <text x="472" y="172" font-family="sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">desiredSize = 3 - 3 = 0</text>
  <text x="472" y="196" font-family="sans-serif" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">Backpressure (역압) 활성화</text>
  <text x="472" y="216" font-family="sans-serif" font-size="11" fill="#1f2937" text-anchor="middle">추가 pull() 호출 차단 및 대기</text>
</svg>