<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380">
  <rect width="640" height="380" fill="#ffffff" />
  <rect x="15" y="15" width="610" height="350" rx="8" fill="none" stroke="#1f2937" stroke-width="2" />
  <text x="35" y="42" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f2937">웹 브라우저 샌드박스 (Web Browser Sandbox) - 오리진 격리</text>

  <!-- Main Thread -->
  <rect x="35" y="60" width="270" height="110" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />
  <text x="50" y="82" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb">Main Thread 실행 컨텍스트</text>
  <text x="50" y="105" font-family="sans-serif" font-size="12" fill="#1f2937">navigator.storage.getDirectory()</text>
  <text x="50" y="125" font-family="sans-serif" font-size="12" fill="#1f2937">createWritable() -> 비동기 스트림</text>
  <text x="50" y="145" font-family="sans-serif" font-size="12" fill="#dc2626">동기 I/O 불허 (UI 블로킹 방지)</text>

  <!-- Dedicated Web Worker -->
  <rect x="335" y="60" width="270" height="110" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" />
  <text x="350" y="82" font-family="sans-serif" font-size="13" font-weight="bold" fill="#16a34a">Dedicated Web Worker 컨텍스트</text>
  <text x="350" y="105" font-family="sans-serif" font-size="12" fill="#1f2937">createSyncAccessHandle() 지원</text>
  <text x="350" y="125" font-family="sans-serif" font-size="12" fill="#1f2937">동기 바이트 I/O (read, write, flush)</text>
  <text x="350" y="145" font-family="sans-serif" font-size="12" fill="#16a34a">Wasm / SQLite 가상 파일 시스템</text>

  <!-- OPFS Boundary -->
  <rect x="35" y="190" width="570" height="115" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="4 4" />
  <text x="50" y="212" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">Origin Private File System (OPFS 가상 디렉터리 트리)</text>
  
  <rect x="50" y="225" width="160" height="65" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1" />
  <text x="60" y="247" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2563eb">Root Directory</text>
  <text x="60" y="267" font-family="sans-serif" font-size="12" fill="#1f2937">권한 팝업 없음 (즉시 획득)</text>

  <rect x="235" y="225" width="160" height="65" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1" />
  <text x="245" y="247" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937">config.json</text>
  <text x="245" y="267" font-family="sans-serif" font-size="12" fill="#1f2937">비동기 Writable 스트림</text>

  <rect x="420" y="225" width="165" height="65" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1" />
  <text x="430" y="247" font-family="sans-serif" font-size="12" font-weight="bold" fill="#16a34a">app_production.db</text>
  <text x="430" y="267" font-family="sans-serif" font-size="12" fill="#1f2937">동기 배타적 락 점유</text>

  <!-- Host OS boundary note -->
  <rect x="35" y="320" width="570" height="35" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1" />
  <text x="50" y="342" font-family="sans-serif" font-size="12" fill="#dc2626">호스트 OS 파일 탐색기 (Finder / 탐색기) 직접 노출 불가 - 브라우저 프로필 내부 격리</text>
</svg>