<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380">
  <rect width="640" height="380" fill="#ffffff" />
  <text x="320" y="32" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">Model Context Protocol (MCP) 전송 계층 아키텍처</text>
  
  <rect x="170" y="52" width="300" height="42" rx="6" fill="#f3f4f6" stroke="#1f2937" stroke-width="1.5" />
  <text x="320" y="78" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="middle">AI 클라이언트 (Claude Desktop / IDE / Web Agent)</text>
  
  <line x1="320" y1="94" x2="320" y2="120" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="3 3" />
  
  <rect x="170" y="120" width="300" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="320" y="145" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">MCP 프로토콜 계층 (JSON-RPC 2.0 시맨틱)</text>
  
  <line x1="220" y1="160" x2="110" y2="198" stroke="#1f2937" stroke-width="1.5" />
  <line x1="320" y1="160" x2="320" y2="198" stroke="#1f2937" stroke-width="1.5" />
  <line x1="420" y1="160" x2="530" y2="198" stroke="#1f2937" stroke-width="1.5" />
  
  <rect x="20" y="198" width="180" height="135" rx="6" fill="#f9fafb" stroke="#1f2937" stroke-width="1.5" />
  <text x="110" y="222" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">stdio 전송</text>
  <text x="30" y="246" font-family="sans-serif" font-size="12" fill="#1f2937">• OS 표준 입출력 파이프</text>
  <text x="30" y="268" font-family="sans-serif" font-size="12" fill="#1f2937">• 서브밀리초 지연 시간</text>
  <text x="30" y="290" font-family="sans-serif" font-size="12" fill="#1f2937">• 자식 프로세스 1:1 바인딩</text>
  <text x="30" y="312" font-family="sans-serif" font-size="12" fill="#1f2937">• 포트 개방 없음 (로컬 전용)</text>
  
  <rect x="230" y="198" width="180" height="135" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
  <text x="320" y="222" font-family="sans-serif" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="middle">Streamable HTTP</text>
  <text x="240" y="246" font-family="sans-serif" font-size="12" fill="#1f2937">• 단일 엔드포인트 (/mcp)</text>
  <text x="240" y="268" font-family="sans-serif" font-size="12" fill="#1f2937">• POST 요청 + SSE 스트림</text>
  <text x="240" y="290" font-family="sans-serif" font-size="12" fill="#1f2937">• Mcp-Session-Id 세션 추적</text>
  <text x="240" y="312" font-family="sans-serif" font-size="12" fill="#1f2937">• OAuth 2.1 / API Gateway</text>
  
  <rect x="440" y="198" width="180" height="135" rx="6" fill="#f9fafb" stroke="#1f2937" stroke-width="1.5" />
  <text x="530" y="222" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="middle">In-Memory / Worker</text>
  <text x="450" y="246" font-family="sans-serif" font-size="12" fill="#1f2937">• 메모리 큐 / postMessage</text>
  <text x="450" y="268" font-family="sans-serif" font-size="12" fill="#1f2937">• I/O 직렬화 부하 제로</text>
  <text x="450" y="290" font-family="sans-serif" font-size="12" fill="#1f2937">• 단위 테스트 검증 최적화</text>
  <text x="450" y="312" font-family="sans-serif" font-size="12" fill="#1f2937">• 브라우저 샌드박스 격리</text>
  
  <text x="320" y="360" font-family="sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">도구 비즈니스 로직(Tool/Resource)은 동일하게 유지되고 물리 전송 계층만 교체됨</text>
</svg>