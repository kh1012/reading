<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="360">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#1f2937"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="#ffffff"/>

  <!-- Title -->
  <text x="24" y="32" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f2937">PerformanceObserver 공간 구조 및 데이터 흐름</text>

  <!-- Box 1: Browser Runtime -->
  <rect x="24" y="56" width="180" height="274" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="36" y="80" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb">브라우저 엔진 (Browser)</text>

  <rect x="34" y="96" width="160" height="72" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
  <text x="44" y="116" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937">PerformanceEntry 생성</text>
  <text x="44" y="136" font-family="sans-serif" font-size="12" fill="#1f2937">• Resource / Paint</text>
  <text x="44" y="154" font-family="sans-serif" font-size="12" fill="#1f2937">• Layout Shift / Event</text>

  <line x1="114" y1="168" x2="114" y2="186" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="34" y="188" width="160" height="52" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
  <text x="42" y="208" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2563eb">Queue Algorithm</text>
  <text x="42" y="226" font-family="sans-serif" font-size="12" fill="#1f2937">관찰 타입 필터링 라우팅</text>

  <rect x="34" y="252" width="160" height="66" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="42" y="272" font-family="sans-serif" font-size="12" font-weight="bold" fill="#dc2626">전역 버퍼 (Global Buffer)</text>
  <text x="42" y="290" font-family="sans-serif" font-size="12" fill="#1f2937">getEntries() 영구 누적</text>
  <text x="42" y="306" font-family="sans-serif" font-size="12" fill="#dc2626">기본 용량 한도: 250개</text>

  <!-- Box 2: PerformanceObserver Instance -->
  <rect x="228" y="56" width="184" height="274" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="240" y="80" font-family="sans-serif" font-size="13" font-weight="bold" fill="#16a34a">PerformanceObserver</text>

  <rect x="238" y="96" width="164" height="96" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
  <text x="246" y="116" font-family="sans-serif" font-size="12" font-weight="bold" fill="#16a34a">Observer Buffer (내부 큐)</text>
  <text x="246" y="136" font-family="sans-serif" font-size="12" fill="#1f2937">• 등록 타입 엔트리 적재</text>
  <text x="246" y="154" font-family="sans-serif" font-size="12" fill="#1f2937">• 과거 엔트리 (buffered)</text>
  <text x="246" y="174" font-family="sans-serif" font-size="12" fill="#16a34a">• 콜백 시 즉시 자동 비움</text>

  <rect x="238" y="204" width="164" height="114" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
  <text x="246" y="224" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937">관찰자 제어 메서드</text>
  <text x="246" y="244" font-family="sans-serif" font-size="12" fill="#2563eb">• observe({ type, buffered })</text>
  <text x="246" y="264" font-family="sans-serif" font-size="12" fill="#1f2937">• takeRecords(): 동기 비우기</text>
  <text x="246" y="284" font-family="sans-serif" font-size="12" fill="#dc2626">• disconnect(): 등록 해제</text>
  <text x="246" y="302" font-family="sans-serif" font-size="12" fill="#1f2937">  (메모리 누수 방지)</text>

  <!-- Box 3: Event Loop & Application -->
  <rect x="436" y="56" width="180" height="274" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="448" y="80" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">이벤트 루프 &amp; 콜백</text>

  <rect x="446" y="96" width="160" height="82" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
  <text x="454" y="116" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2563eb">Timeline Task Source</text>
  <text x="454" y="136" font-family="sans-serif" font-size="12" fill="#1f2937">• 저우선순위 비동기 큐</text>
  <text x="454" y="152" font-family="sans-serif" font-size="12" fill="#1f2937">• task queued 플래그</text>
  <text x="454" y="168" font-family="sans-serif" font-size="12" fill="#16a34a">• 브라우저 유휴 시간 실행</text>

  <rect x="446" y="190" width="160" height="128" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
  <text x="454" y="210" font-family="sans-serif" font-size="12" font-weight="bold" fill="#16a34a">JavaScript 콜백 실행</text>
  <text x="454" y="230" font-family="sans-serif" font-size="12" fill="#1f2937">callback(list, obs, opt)</text>
  <text x="454" y="250" font-family="sans-serif" font-size="12" fill="#1f2937">• list.getEntries()</text>
  <text x="454" y="268" font-family="sans-serif" font-size="12" fill="#1f2937">• droppedEntriesCount</text>
  <text x="454" y="288" font-family="sans-serif" font-size="12" fill="#2563eb">• Core Web Vitals 집계</text>
  <text x="454" y="304" font-family="sans-serif" font-size="12" fill="#1f2937">• RUM 메트릭 전송</text>

  <!-- Connectors -->
  <line x1="194" y1="214" x2="232" y2="152" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="320" y1="96" x2="440" y2="120" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow-blue)"/>
  <line x1="526" y1="178" x2="526" y2="186" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="446" y1="220" x2="408" y2="160" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow-green)"/>
</svg>