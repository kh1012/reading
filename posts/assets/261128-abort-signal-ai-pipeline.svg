<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="100%" height="330">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#1f2937" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="640" height="330" fill="#ffffff" rx="8" />

  <!-- Title -->
  <text x="320" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#1f2937">AbortSignal 기반 AI 스트리밍 취소 파이프라인 흐름도</text>

  <!-- Node 1: Trigger Sources -->
  <rect x="25" y="48" width="150" height="80" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="100" y="68" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#1f2937">취소 트리거 (Triggers)</text>
  <text x="35" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">• 사용자 Stop 버튼 클릭</text>
  <text x="35" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">• AbortSignal.timeout(15s)</text>

  <!-- Arrow: Node 1 -> Node 2 -->
  <line x1="175" y1="88" x2="228" y2="88" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Node 2: Composite Signal -->
  <rect x="235" y="48" width="165" height="80" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
  <text x="317" y="68" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#1f2937">AbortSignal.any() 합성</text>
  <text x="245" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">• 다중 신호 단일 시그널화</text>
  <text x="245" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">• 선언적 협력적 취소 제어</text>

  <!-- Arrow: Node 2 -> Branch A -->
  <path d="M 400 75 L 430 75 L 448 65" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Branch A: On-Device AI -->
  <rect x="455" y="38" width="160" height="74" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
  <text x="535" y="56" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#1f2937">온디바이스 AI (Gemini Nano)</text>
  <text x="465" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">• NPU/GPU IPC 즉시 중단</text>
  <text x="465" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">• contextWindow 토큰 보존</text>

  <!-- Arrow: Node 2 -> Branch B -->
  <path d="M 400 102 L 430 102 L 448 145" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Branch B: Cloud LLM -->
  <rect x="455" y="125" width="160" height="74" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" />
  <text x="535" y="143" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#1f2937">클라우드 LLM (Vercel/Next)</text>
  <text x="465" y="161" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">• HTTP/2 RST_STREAM 전송</text>
  <text x="465" y="179" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">• req.signal 백엔드 전파 차단</text>

  <!-- Node 3: Defensive Cleanup -->
  <rect x="70" y="235" width="500" height="72" rx="6" fill="#f9fafb" stroke="#1f2937" stroke-width="1.5" />
  <text x="320" y="255" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#1f2937">클라이언트 방어적 자원 정리 (Clean-up &amp; Handling)</text>
  <text x="90" y="276" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">• finally 블록에서 reader.releaseLock() 호출 (스트림 잠금 방지)</text>
  <text x="90" y="294" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">• { once: true } 리스너 해제 (메모리 누수 방지) 및 DOMException('AbortError') 필터링</text>

  <!-- Connecting arrows from branches to cleanup -->
  <path d="M 535 112 L 535 215 L 430 230" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)" />
  <path d="M 535 199 L 535 215 L 430 230" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-dasharray="3,3" />
</svg>