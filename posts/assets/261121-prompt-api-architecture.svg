<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="100%" height="100%">
  <rect width="640" height="260" fill="#ffffff"/>
  
  <!-- Boundary Box: Browser Sandbox -->
  <rect x="15" y="15" width="455" height="230" rx="8" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="30" y="36" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2563eb">Local Device &amp; Browser Sandbox (Zero Cloud Egress)</text>

  <!-- Web Application Layer -->
  <rect x="30" y="55" width="125" height="170" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="40" y="78" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">Web App Context</text>
  <text x="40" y="100" font-family="sans-serif" font-size="12" fill="#1f2937">• JS Execution</text>
  <text x="40" y="122" font-family="sans-serif" font-size="12" fill="#1f2937">• ReadableStream</text>
  <text x="40" y="144" font-family="sans-serif" font-size="12" fill="#1f2937">• AbortSignal</text>
  <text x="40" y="166" font-family="sans-serif" font-size="12" fill="#1f2937">• DOM Update</text>
  <rect x="38" y="185" width="109" height="26" rx="4" fill="#2563eb" fill-opacity="0.1"/>
  <text x="46" y="202" font-family="sans-serif" font-size="11" fill="#2563eb">Zero Bundle Size</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="155" y1="140" x2="175" y2="140" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="175,136 183,140 175,144" fill="#1f2937"/>

  <!-- Web Platform Layer -->
  <rect x="185" y="55" width="130" height="170" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="195" y="78" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb">LanguageModel</text>
  <text x="195" y="100" font-family="sans-serif" font-size="12" fill="#1f2937">• availability()</text>
  <text x="195" y="122" font-family="sans-serif" font-size="12" fill="#1f2937">• create() 세션</text>
  <text x="195" y="144" font-family="sans-serif" font-size="12" fill="#1f2937">• promptStreaming</text>
  <text x="195" y="166" font-family="sans-serif" font-size="12" fill="#1f2937">• measureContext</text>
  <text x="195" y="188" font-family="sans-serif" font-size="12" fill="#dc2626">• destroy() 해제</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="315" y1="140" x2="335" y2="140" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="335,136 343,140 335,144" fill="#1f2937"/>

  <!-- Local Engine Layer -->
  <rect x="345" y="55" width="115" height="170" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="355" y="78" font-family="sans-serif" font-size="13" font-weight="bold" fill="#16a34a">Gemini Nano</text>
  <text x="355" y="100" font-family="sans-serif" font-size="12" fill="#1f2937">• 내장 파운데이션</text>
  <text x="355" y="122" font-family="sans-serif" font-size="12" fill="#1f2937">• GPU/NPU 가속</text>
  <text x="355" y="144" font-family="sans-serif" font-size="12" fill="#1f2937">• VRAM 컨텍스트</text>
  <text x="355" y="166" font-family="sans-serif" font-size="12" fill="#1f2937">• 오프라인 추론</text>
  <rect x="353" y="185" width="99" height="26" rx="4" fill="#16a34a" fill-opacity="0.1"/>
  <text x="361" y="202" font-family="sans-serif" font-size="11" fill="#16a34a">Zero RTT / Cost</text>

  <!-- Boundary Cutoff Block -->
  <line x1="470" y1="140" x2="505" y2="140" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="485" y1="130" x2="495" y2="150" stroke="#dc2626" stroke-width="2"/>
  <line x1="495" y1="130" x2="485" y2="150" stroke="#dc2626" stroke-width="2"/>

  <!-- Cloud LLM External Block -->
  <rect x="510" y="55" width="115" height="170" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="520" y="78" font-family="sans-serif" font-size="13" font-weight="bold" fill="#dc2626">External Cloud</text>
  <text x="520" y="102" font-family="sans-serif" font-size="12" fill="#1f2937">• OpenAI / Claude</text>
  <text x="520" y="126" font-family="sans-serif" font-size="12" fill="#dc2626">• 토큰당 과금</text>
  <text x="520" y="150" font-family="sans-serif" font-size="12" fill="#dc2626">• 네트워크 지연</text>
  <text x="520" y="174" font-family="sans-serif" font-size="12" fill="#dc2626">• PII 전송 위험</text>
  <rect x="518" y="188" width="99" height="24" rx="4" fill="#dc2626" fill-opacity="0.1"/>
  <text x="525" y="204" font-family="sans-serif" font-size="11" font-weight="bold" fill="#dc2626">차단됨 (No Call)</text>
</svg>