<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" width="620" height="340">
  <rect width="620" height="340" fill="#ffffff"/>
  <rect x="20" y="20" width="580" height="300" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="40" y="50" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f2937">FinalizationRegistry 생명주기 및 비동기 작업 큐잉 구조</text>

  <rect x="40" y="80" width="120" height="70" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="50" y="105" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2563eb">1. 객체 등록</text>
  <text x="50" y="125" font-family="sans-serif" font-size="12" fill="#1f2937">register(target,</text>
  <text x="50" y="140" font-family="sans-serif" font-size="12" fill="#1f2937">heldValue, token)</text>

  <rect x="190" y="80" width="120" height="70" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="200" y="105" font-family="sans-serif" font-size="12" font-weight="bold" fill="#dc2626">2. GC 객체 회수</text>
  <text x="200" y="125" font-family="sans-serif" font-size="12" fill="#1f2937">target 메모리 해제</text>
  <text x="200" y="140" font-family="sans-serif" font-size="12" fill="#dc2626">비결정적 발생</text>

  <rect x="340" y="80" width="120" height="70" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="350" y="105" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937">3. 태스크 큐잉</text>
  <text x="350" y="125" font-family="sans-serif" font-size="12" fill="#2563eb">HostEnqueue...</text>
  <text x="350" y="140" font-family="sans-serif" font-size="12" fill="#1f2937">일반 태스크 등록</text>

  <rect x="480" y="80" width="110" height="70" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="490" y="105" font-family="sans-serif" font-size="12" font-weight="bold" fill="#16a34a">4. 콜백 비동기 실행</text>
  <text x="490" y="125" font-family="sans-serif" font-size="12" fill="#1f2937">cleanupCallback</text>
  <text x="490" y="140" font-family="sans-serif" font-size="12" fill="#16a34a">(heldValue)</text>

  <line x1="160" y1="115" x2="190" y2="115" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="190,115 182,111 182,119" fill="#1f2937"/>

  <line x1="310" y1="115" x2="340" y2="115" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="340,115 332,111 332,119" fill="#1f2937"/>

  <line x1="460" y1="115" x2="480" y2="115" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="480,115 472,111 472,119" fill="#1f2937"/>

  <rect x="40" y="180" width="270" height="50" rx="6" fill="#ffffff" stroke="#dc2626" stroke-dasharray="4 4" stroke-width="1.5"/>
  <text x="50" y="200" font-family="sans-serif" font-size="12" font-weight="bold" fill="#dc2626">unregister(unregisterToken)</text>
  <text x="50" y="218" font-family="sans-serif" font-size="12" fill="#1f2937">GC 수거 전 정리 콜백 대기열에서 등록 명시적 취소</text>

  <rect x="40" y="250" width="540" height="50" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
  <text x="50" y="270" font-family="sans-serif" font-size="12" fill="#1f2937">정리 콜백은 동기 실행되지 않고 WHATWG 작업 소스를 통해 이벤트 루프 일반 태스크로 실행됩니다.</text>
  <text x="50" y="288" font-family="sans-serif" font-size="12" fill="#dc2626">동일 객체 등록 시 WeakRef 대상이 먼저 비워져 콜백 내부 deref()는 항상 undefined를 반환합니다.</text>
</svg>